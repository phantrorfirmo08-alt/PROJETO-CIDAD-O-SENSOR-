<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidadão Sensor - Sebinho</title>
    <meta name="theme-color" content="#0f172a">
    <style>
        :root { --bg:#0f172a; --accent:#38bdf8; --danger:#ef4444; --warning:#f59e0b; --text:#f1f5f9; --safe:#10b981; }
        body { font-family:'Segoe UI',sans-serif; background:radial-gradient(circle at 50% 30%,#1e293b,#0f172a); color:var(--text); height:100vh; margin:0; display:flex; flex-direction:column; overflow:hidden; }
        body.light-mode { background:radial-gradient(circle at 50% 30%,#e2e8f0,#cbd5e1); color:#0f172a; }
        header { padding:15px; display:flex; justify-content:space-between; align-items:center; background:rgba(15,23,42,.8); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,255,255,.1); }
        .logo { font-weight:bold; font-size:1.1rem; } .logo span { color:var(--accent); }
        .icon-btn { background:rgba(255,255,255,.1); border:none; color:white; width:36px; height:36px; border-radius:50%; cursor:pointer; }
        #avatar-container { flex:1; display:flex; justify-content:center; align-items:center; }
        canvas { width:250px; height:250px; border-radius:50%; box-shadow:0 0 30px rgba(0,0,0,.5); }
        #status-bar { text-align:center; padding:10px; font-weight:bold; background:rgba(0,0,0,.3); }
        .status-safe { color:var(--safe); } .status-warning { color:var(--warning); animation:pulse 1s infinite; } .status-danger { color:var(--danger); animation:pulse .5s infinite; }
        @keyframes pulse { 50% { opacity:.4; } }
        #log-area { height:130px; overflow-y:auto; padding:10px; font-size:.85rem; background:rgba(0,0,0,.2); border-top:1px solid rgba(255,255,255,.1); }
        .log-entry { margin-bottom:5px; border-left:2px solid var(--accent); padding-left:8px; }
        #controls { padding:15px; background:rgba(15,23,42,.9); display:flex; flex-direction:column; gap:10px; }
        .input-group { display:flex; gap:10px; }
        input { flex:1; padding:12px; border-radius:20px; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.3); color:white; outline:none; }
        button.main-btn { padding:12px; border-radius:20px; border:none; cursor:pointer; background:var(--accent); color:#000; font-weight:bold; }
        #alert-overlay { position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:100; display:none; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:20px; }
        #alert-overlay.active { display:flex; }
        .alert-icon { font-size:80px; margin-bottom:20px; } .alert-title { font-size:24px; font-weight:bold; margin-bottom:10px; } .alert-msg { font-size:16px; line-height:1.5; margin-bottom:20px; }
        .btn-close-alert { background:white; color:black; border:none; padding:10px 30px; border-radius:20px; font-weight:bold; cursor:pointer; }
    </style>
</head>
<body>
    <header>
        <div class="logo">📡 CIDADÃO <span>SENSOR</span></div>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleTheme()">🌙</button>
            <button class="icon-btn" onclick="shareApp()">🔗</button>
        </div>
    </header>
    <div id="status-bar" class="status-safe">SISTEMA ONLINE - Monitorando Sebinho (Mesquita/RJ)</div>
    <div id="avatar-container"><canvas id="avatar-canvas" width="300" height="300"></canvas></div>
    <div id="log-area"><div class="log-entry">Sistema iniciado...</div></div>
    <div id="controls">
        <div class="input-group">
            <input type="password" id="api-key-input" placeholder="Chave API (Opcional)">
            <button class="icon-btn" onclick="saveApiKey()">💾</button>
        </div>
        <button class="main-btn" style="width:100%" onclick="forceCheck()">FORÇAR VERIFICAÇÃO DE RISCO</button>
    </div>
    <div id="alert-overlay">
        <div class="alert-icon" id="alert-icon">⚠️</div>
        <div class="alert-title" id="alert-title">ATENÇÃO</div>
        <div class="alert-msg" id="alert-msg"></div>
        <button class="btn-close-alert" onclick="closeAlert()">FECHAR</button>
    </div>

    <script>
        // ===== 1. MANIFEST EMBUTIDO (Tudo num arquivo só) =====
        const manifestData = {
            name: "Cidadão Sensor - Sebinho",
            short_name: "Cidadão Sensor",
            start_url: "./",
            display: "standalone",
            background_color: "#0f172a",
            theme_color: "#0f172a",
            icons: [
                { src: "https://cdn-icons-png.flaticon.com/512/2921/2921226.png", sizes: "192x192", type: "image/png" },
                { src: "https://cdn-icons-png.flaticon.com/512/2921/2921226.png", sizes: "512x512", type: "image/png" }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
        const manifestURL = URL.createObjectURL(manifestBlob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);

        // ===== 2. SERVICE WORKER EMBUTIDO =====
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE='cs-v1'; const urls=['./'];
                self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(urls))));
                self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));
            `;
            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            const swURL = URL.createObjectURL(swBlob);
            navigator.serviceWorker.register(swURL).catch(()=>{});
        }

        // ===== 3. LÓGICA DO APP =====
        const LAT = -22.777, LON = -43.460;
        let isTalking=false, isBlinking=false, eyeOpenness=1, avatarColor='#38bdf8';
        const canvas=document.getElementById('avatar-canvas'), ctx=canvas.getContext('2d');
        const statusBar=document.getElementById('status-bar'), logArea=document.getElementById('log-area');
        const apiKeyInput=document.getElementById('api-key-input');

        window.onload=()=>{
            const saved=localStorage.getItem('cs_key'); if(saved) apiKeyInput.value=saved;
            drawAvatar(); fetchWeatherData(); setInterval(fetchWeatherData,60000);
        };

        function drawAvatar(){
            ctx.clearRect(0,0,canvas.width,canvas.height);
            const cx=canvas.width/2, cy=canvas.height/2;
            ctx.beginPath(); ctx.arc(cx,cy,100,0,Math.PI*2); ctx.fillStyle='#0f172a'; ctx.fill();
            ctx.lineWidth=5; ctx.strokeStyle=avatarColor; ctx.shadowBlur=20; ctx.shadowColor=avatarColor; ctx.stroke(); ctx.shadowBlur=0;
            const eyeY=cy-20, eyeH=15*eyeOpenness;
            ctx.fillStyle='white';
            ctx.beginPath(); ctx.ellipse(cx-30,eyeY,15,eyeH,0,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(cx+30,eyeY,15,eyeH,0,0,Math.PI*2); ctx.fill();
            if(eyeOpenness>.5){ ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(cx-30,eyeY,5,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(cx+30,eyeY,5,0,Math.PI*2); ctx.fill(); }
            ctx.beginPath(); ctx.fillStyle=avatarColor; ctx.ellipse(cx,cy+40,20,isTalking?Math.random()*15+5:5,0,0,Math.PI*2); ctx.fill();
            requestAnimationFrame(drawAvatar);
        }
        setInterval(()=>{ if(Math.random()>.95){ isBlinking=true; setTimeout(()=>isBlinking=false,150);} eyeOpenness=isBlinking?.1:1; },100);

        async function fetchWeatherData(){
            try{
                const url=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=precipitation,wind_speed_10m&hourly=precipitation_probability&timezone=America/Sao_Paulo`;
                const res=await fetch(url); const d=await res.json();
                const chuva=d.current.precipitation, vento=d.current.wind_speed_10m, prob=d.hourly.precipitation_probability[0];
                log(`Chuva: ${chuva}mm | Vento: ${vento}km/h | Prob: ${prob}%`);
                analyzeRisk(chuva,vento,prob);
            }catch(e){ log("Erro ao conectar. Verifique internet."); }
        }

        function analyzeRisk(chuva,vento,prob){
            statusBar.className="status-safe"; avatarColor='#38bdf8'; statusBar.innerText="SISTEMA ONLINE - Monitorando Sebinho";
            if(chuva>5||vento>60||(prob>90&&chuva>1)){
                triggerAlert('RED','🚨 RISCO DE TRANSBORDO DO RIO SARAPUÍ','Atenção Comunidade do Sebinho! Chuva forte na Rua Amazonas. Rio Sarapuí pode transbordar. Procure abrigo. Programa Cidades Resilientes ONU-Habitat recomenda cautela.');
                return;
            }
            if(chuva>1||vento>40||prob>70){
                statusBar.className="status-warning"; avatarColor='#f59e0b'; statusBar.innerText="ALERTA AMARELO - CHUVA FORTCHEGANDO";
                speak("Alerta amarelo. Chuva forte se aproximando do Sebinho. Fique atento."); log("ALERTA AMARELO");
            }
        }

        function triggerAlert(type,title,msg){
            const o=document.getElementById('alert-overlay'); o.classList.add('active');
            document.getElementById('alert-icon').innerText=type==='RED'?'🚨':'⚠️';
            document.getElementById('alert-title').innerText=title; document.getElementById('alert-msg').innerText=msg;
            avatarColor=type==='RED'?'#ef4444':'#f59e0b'; statusBar.className=type==='RED'?"status-danger":"status-warning";
            statusBar.innerText=type==='RED'?"🚨 ALERTA VERMELHO":"⚠️ ALERTA AMARELO";
            speak(msg);
        }
        function closeAlert(){ document.getElementById('alert-overlay').classList.remove('active'); }

        function speak(t){ const s=window.speechSynthesis; if(s.speaking)s.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='pt-BR'; u.onstart=()=>isTalking=true; u.onend=()=>isTalking=false; s.speak(u); }
        function log(m){ const d=document.createElement('div'); d.className='log-entry'; d.innerText=new Date().toLocaleTimeString()+' - '+m; logArea.appendChild(d); logArea.scrollTop=logArea.scrollHeight; }
        function saveApiKey(){ localStorage.setItem('cs_key',apiKeyInput.value); alert('Chave salva no navegador!'); }
        function toggleTheme(){ document.body.classList.toggle('light-mode'); }
        function shareApp(){ navigator.share?navigator.share({title:'Cidadão Sensor',url:location.href}):alert('Copie: '+location.href); }
        function forceCheck(){ fetchWeatherData(); }
    </script>
</body>
</html>
