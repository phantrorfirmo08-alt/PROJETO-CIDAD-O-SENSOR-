        <!-- Seção de Registro com IA (Sem campos de chave visíveis) -->
        <div class="card">
            <h2>⚠️ Registrar Ocorrência com Análise de IA</h2>
            <form id="reportForm" onsubmit="enviarComIA(event)">
                <label for="local">Local / Endereço:</label>
                <input type="text" id="local" placeholder="Ex: Rua principal, altura do número 100" required>
                
                <label for="descricao">Descrição do Risco:</label>
                <textarea id="descricao" rows="3" placeholder="Descreva o problema (ex: acúmulo de água, movimentação de encosta...)" required></textarea>
                
                <button type="submit" class="btn" id="btnEnviar">Analisar e Enviar com IA</button>
            </form>
            
            <!-- Resposta da IA -->
            <div id="aiResponse" class="ai-output"></div>
        </div>

        <div class="card">
            <h2>📞 Contatos Úteis</h2>
            <a href="tel:199" class="btn btn-secondary" style="margin-top: 0;">Ligar para Defesa Civil (199)</a>
        </div>
    </div>

        DCCS Cidadão Sensor &copy; 2026 - PWA Ativo

    <!-- Lógica de Integração Automática com a API Gemini -->
    <script>
        // CHAVE DA API INTEGRADA DO COFRE SECRETO
        // Se você usar automação (GitHub Actions), ela pode substituir esta linha automaticamente.
        const GEMINI_API_KEY = "SUA_CHAVE_SECRETA_AQUI"; 

        async function enviarComIA(e) {
            e.preventDefault();
            const local = document.getElementById('local').value;
            const descricao = document.getElementById('descricao').value;
            const responseBox = document.getElementById('aiResponse');
            const btnEnviar = document.getElementById('btnEnviar');

            if (!GEMINI_API_KEY || GEMINI_API_KEY === "SUA_CHAVE_SECRETA_AQUI") {
                alert('Erro de configuração: A chave da API não foi definida no código.');
                return;
            }

            btnEnviar.disabled = true;
            btnEnviar.textContent = 'Analisando com Gemini...';
            responseBox.style.display = 'block';
            responseBox.textContent = 'Conectando com o Google AI Studio para avaliar o risco...';

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                
                const prompt = `Atue como um especialista em Defesa Civil comunitária e análise de riscos urbanos. Um cidadão registrou o seguinte alerta:\n- Local: ${local}\n- Descrição: ${descricao}\n\nPor favor, forneça:\n1. Uma breve avaliação do nível provável de risco (Baixo, Médio ou Alto).\n2. Duas recomendações imediatas de segurança para os moradores.\n3. Uma sugestão curta de texto técnico formal para envio ao órgão municipal competente.`;

                const respostaAPI = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: prompt }]
                        }]
                    })
                });

                const dados = await respostaAPI.json();

                if (dados.candidates && dados.candidates[0].content.parts[0].text) {
                    const textoIA = dados.candidates[0].content.parts[0].text;
                    responseBox.innerHTML = `<strong>🤖 Análise do DCCS / Gemini IA:</strong><br><br>${textoIA.replace(/\n/g, '<br>')}`;
                } else {
                    throw new Error('Retorno inesperado da API.');
                }

            } catch (erro) {
                responseBox.textContent = 'Erro ao processar com a IA. Detalhe: ' + erro.message;
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.textContent = 'Analisar e Enviar com IA';
            }
        }

        // Registro de Service Worker para o PWA funcionar perfeitamente offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', (e) => { self.skipWaiting(); });
                    self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
                    self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });
                `;
                const blob = new Blob([swCode], { type: 'text/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(() => {});
            });
        }
    </script>
