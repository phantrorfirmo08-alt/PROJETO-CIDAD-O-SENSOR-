<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cidadão Sensor - Sebinho</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        :root {
            --bg: #0f172a; --glass: rgba(30, 41, 59, 0.7);
            --accent: #38bdf8; --danger: #ef4444; --warning: #f59e0b;
            --text: #f1f5f9; --safe: #10b981;
        }
        /* Modo Noturno (Padrão) */
        body {
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);
            color: var(--text); height: 100vh; margin: 0;
            display: flex; flex-direction: column; overflow: hidden;
            transition: background 0.5s;
        }
        body.light-mode {
            background: radial-gradient(circle at 50% 30%, #e2e8f0 0%, #cbd5e1 100%);
            color: #0f172a;
        }
        body.light-mode .glass { background: rgba(255,255,255,0.7); color: #0f172a; }
        body.light-mode input { background: rgba(255,255,255,0.5); color: #0f172a; }

        /* Header */
        header {
            padding: 15px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 10;
        }
        .logo { font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--accent); }
        .header-actions { display: flex; gap: 10px; }
        .icon-btn {
            background: rgba(255,255,255,0.1); border: none; color: white;
            width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* Avatar */
        #avatar-container {
            flex: 1; display: flex; justify-content: center; align-items: center;
            position: relative;
        }
        canvas { width: 250px; height: 250px; border-radius: 50%; box-shadow: 0 0 30px rgba(0,0,0,0.5); }

        /* Status & Alertas */
        #status-bar {
            text-align: center; padding: 10px; font-weight: bold;
            background: rgba(0,0,0,0.3); font-size: 0.9rem;
        }
        .status-safe { color: var(--safe); }
        .status-warning { color: var(--warning); animation: pulse 1s infinite; }
        .status-danger { color: var(--danger); animation: pulse 0.5s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Chat/Log */
        #log-area {
            height: 150px; overflow-y: auto; padding: 10px; font-size: 0.85rem;
            background: rgba(0,0,0,0.2); border-top: 1px solid rgba(255,255,255,0.1);
        }
        .log-entry { margin-bottom: 5px; border-left: 2px solid var(--accent); padding-left: 8px; }

        /* Input & Controls */
        #controls {
            padding: 15px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; gap: 10px;
        }
        .input-group { display: flex; gap: 10px; }
        input {
            flex: 1; padding: 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3); color: white; outline: none;
        }
        button.main-btn {
            padding: 12px 20px; border-radius: 20px; border: none; cursor: pointer;
            background: var(--accent); color: #000; font-weight: bold; transition: 0.3s;
        }
        button.main-btn:hover { transform: scale(1.05); }

        /* Alert Overlay */
        #alert-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
        }
        #alert-overlay.active { display: flex; }
        .alert-icon { font-size: 80px; margin-bottom: 20px; }
        .alert-title { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .alert-msg { font-size: 16px; line-height: 1.5; margin-bottom: 20px; }
        .btn-close-alert { background: white; color: black; border: none; padding: 10px 30px; border-radius: 20px; font-weight: bold; cursor: pointer; }

    </style>
</head>
<body>

    <header>
        <div class="logo">📡 CIDADÃO <span>SENSOR</span></div>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleTheme()" title="Modo Noturno">🌙</button>
            <button class="icon-btn" onclick="shareApp()" title="Compartilhar">🔗</button>
        </div>
    </header>

    <div id="status-bar" class="status-safe">SISTEMA ONLINE - Monitorando Sebinho (Mesquita/RJ)</div>

    <div id="avatar-container">
        <canvas id="avatar-canvas" width="300" height="300"></canvas>
    </div>

    <div id="log-area">
        <div class="log-entry">Sistema iniciado. Carregando dados do Open-Meteo...</div>
    </div>

    <div id="controls">
        <div class="input-group">
            <input type="password" id="api-key-input" placeholder="Chave API (Opcional - salva no navegador)">
            <button class="icon-btn" onclick="saveApiKey()" title="Salvar Chave">💾</button>
        </div>
        <button class="main-btn" onclick="forceCheck()" style="width: 100%;">FORÇAR VERIFICAÇÃO DE RISCO</button>
    </div>

    <!-- Overlay de Alerta -->
    <div id="alert-overlay">
        <div class="alert-icon" id="alert-icon">⚠️</div>
        <div class="alert-title" id="alert-title">ATENÇÃO</div>
        <div class="alert-msg" id="alert-msg">Mensagem de alerta</div>
        <button class="btn-close-alert" onclick="closeAlert()">FECHAR ALERTA</button>
    </div>

    <script>
        // --- CONFIGURAÇÕES ---
        const LAT = -22.777; // Mesquita, RJ
        const LON = -43.460; // Mesquita, RJ
        let isTalking = false;
        let isBlinking = false;
        let eyeOpenness = 1;
        let avatarColor = '#38bdf8'; // Azul padrão

        // --- ELEMENTOS ---
        const canvas = document.getElementById('avatar-canvas');
        const ctx = canvas.getContext('2d');
        const statusBar = document.getElementById('status-bar');
        const logArea = document.getElementById('log-area');
        const apiKeyInput = document.getElementById('api-key-input');

        // --- INICIALIZAÇÃO ---
        window.onload = () => {
            // Carregar API Key salva
            const savedKey = localStorage.getItem('cidadao_sensor_key');
            if (savedKey) apiKeyInput.value = savedKey;
            
            drawAvatar();
            fetchWeatherData();
            setInterval(fetchWeatherData, 60000); // Atualiza a cada 1 min

            // Registrar Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js');
            }
        };

        // --- LÓGICA DO AVATAR ---
        function drawAvatar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Rosto
            ctx.beginPath();
            ctx.arc(cx, cy, 100, 0, Math.PI * 2);
            ctx.fillStyle = '#0f172a';
            ctx.fill();
            ctx.lineWidth = 5;
            ctx.strokeStyle = avatarColor;
            ctx.shadowBlur = 20;
            ctx.shadowColor = avatarColor;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Olhos
            const eyeY = cy - 20;
            const eyeH = 15 * eyeOpenness;
            
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.ellipse(cx - 30, eyeY, 15, eyeH, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(cx + 30, eyeY, 15, eyeH, 0, 0, Math.PI*2); ctx.fill();

            if (eyeOpenness > 0.5) {
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(cx - 30, eyeY, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx + 30, eyeY, 5, 0, Math.PI*2); ctx.fill();
            }

            // Boca (Fala)
            ctx.beginPath();
            let mouthH = isTalking ? Math.random() * 15 + 5 : 5;
            ctx.fillStyle = avatarColor;
            ctx.ellipse(cx, cy + 40, 20, mouthH, 0, 0, Math.PI*2);
            ctx.fill();

            requestAnimationFrame(drawAvatar);
        }

        // Piscar
        setInterval(() => {
            if(Math.random() > 0.95) {
                isBlinking = true;
                setTimeout(() => { isBlinking = false; }, 150);
            }
            eyeOpenness = isBlinking ? 0.1 : 1;
        }, 100);

        // --- DADOS REAIS (OPEN-METEO) ---
        async function fetchWeatherData() {
            try {
                // Open-Meteo gratuito, sem chave
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=precipitation,wind_speed_10m,temperature_2m&hourly=precipitation_probability&timezone=America/Sao_Paulo`;
                const res = await fetch(url);
                const data = await res.json();

                const chuva = data.current.precipitation; // mm
                const vento = data.current.wind_speed_10m; // km/h
                const probChuva = data.hourly.precipitation_probability[0]; // %

                log(`Chuva: ${chuva}mm | Vento: ${vento}km/h | Prob: ${probChuva}%`);

                analyzeRisk(chuva, vento, probChuva);

            } catch (e) {
                log("Erro ao conectar com Open-Meteo. Verifique internet.");
            }
        }

        // --- LÓGICA DE ALERTA ---
        function analyzeRisk(chuva, vento, prob) {
            // Reset cores
            statusBar.className = "status-safe";
            avatarColor = '#38bdf8';
            statusBar.innerText = "SISTEMA ONLINE - Monitorando Sebinho";

            // GATILHO VERMELHO (Risco Imediato)
            // Chuva > 5mm atual OU Vento > 60km/h OU Probabilidade > 90% com chuva
            if (chuva > 5 || vento > 60 || (prob > 90 && chuva > 1)) {
                triggerAlert('RED', 'RISCO DE TRANSBORDO DO RIO SARAPUÍ', 
                    'Atenção Comunidade do Sebinho! Chuva forte detectada na Rua Amazonas. O Rio Sarapuí pode transbordar. Procure abrigo imediato. O Programa Cidades Resilientes ONU-Habitat recomenda cautela.');
                return;
            }

            // GATILHO AMARELO (Atenção)
            // Chuva > 1mm OU Vento > 40km/h OU Probabilidade > 70%
            if (chuva > 1 || vento > 40 || prob > 70) {
                statusBar.className = "status-warning";
                avatarColor = '#f59e0b';
                statusBar.innerText = "ALERTA AMARELO - CHUVA FORTCHEGANDO";
                speak("Alerta amarelo. Chuva forte se aproximando do Sebinho. Fique atento.");
                log("ALERTA AMARELO DISPARADO");
            }
        }

        function triggerAlert(type, title, msg) {
            const overlay = document.getElementById('alert-overlay');
            const icon = document.getElementById('alert-icon');
            const t = document.getElementById('alert-title');
            const m = document.getElementById('alert-msg');
            
            overlay.classList.add('active');
            overlay.style.border = `5px solid ${type === 'RED' ? 'var(--danger)' : 'var(--warning)'}`;
            
            icon.innerText = type === 'RED' ? '🚨' : '⚠️';
            t.innerText = title;
            m.innerText = msg;
            
            avatarColor = type === 'RED' ? '#ef4444' : '#f59e0b';
            statusBar.className = type === 'RED' ? "status-danger" : "status-warning";
            statusBar
