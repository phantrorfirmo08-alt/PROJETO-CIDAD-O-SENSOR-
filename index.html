<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estação de Sobrevivência • ECDM</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #02040A; color: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; }
        .cyber-card {
            background: linear-gradient(135deg, rgba(13, 21, 45, 0.96) 0%, rgba(6, 11, 24, 0.99) 100%);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(0, 242, 254, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body class="p-4">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const CLOUDFLARE_WORKER_URL = "https://sarah-envelope.phantrorfirmo08.workers.dev/";
        const SARAH_CUSTOM_AVATAR_URL = "https://cdn.imagetourls.com/uploads/tyImg/195w5uur9.png";

        // MÓDULO DE PORTAIS DE SATÉLITE E RADAR 24H
        function PortaisSatelite24HModule() {
            useEffect(() => {
                const criaPortal = (id, centro, marcadores, rota, cor) => {
                    const el = document.getElementById(id);
                    if (!el || el._leaflet_id) return;
                    const map = L.map(id, { minZoom: 10, maxZoom: 17 }).setView(centro, 14);
                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 17, maxNativeZoom: 17, attribution: 'GOES-19 DSAT' }).addTo(map);
                    L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, opacity: 0.45 }).addTo(map);
                    if(rota) L.polyline(rota, { color: cor, weight: 6, dashArray: '12,8' }).addTo(map);
                    marcadores.forEach(m => L.marker(m.c).addTo(map).bindPopup(m.p));
                    setTimeout(() => { map.invalidateSize(); }, 300);
                };

                criaPortal('mapMaria', [-22.8063, -43.4825], [
                    { c: [-22.8058, -43.3685], p: "<b>Serra do Mendanha</b><br>-22.8058,-43.3685<br>Origem Rota Laranja" },
                    { c: [-22.8063, -43.4825], p: "<b>PONTO ZERO: MARIA CRISTINA</b><br>Sebinho / Rua Amazonas<br>Mesquita/RJ<br>Analista Sarah (ECDM)<br>-22.8063,-43.4825" }
                ], [[-22.8058, -43.3685], [-22.8063, -43.4825]], '#FF8C00');

                criaPortal('mapBento', [-22.7075, -43.3666], [
                    { c: [-22.6397, -43.3713], p: "<b>Serra do Tinguá - Jaceruba</b><br>-22.6397,-43.3713<br>Origem Rota Azul" },
                    { c: [-22.7075, -43.3666], p: "<b>Parque Liberdade / São Bento</b><br>Caxias/RJ - Manifesto Obras<br>Analista Sarah (ECDM)<br>-22.7075,-43.3666" }
                ], [[-22.6397, -43.3713], [-22.7075, -43.3666]], '#1E90FF');
            }, []);

            return (
                <div className="space-y-4 max-w-4xl mx-auto font-mono">
                    <div className="cyber-card p-4 sm:p-5 rounded-[28px] border border-[#D4AF37]/70 shadow-2xl space-y-4">
                        <div className="text-center space-y-1 pb-3 border-b border-[#D4AF37]/50">
                            <h2 className="text-[12px] sm:text-[14px] font-black text-[#D4AF37] tracking-wider uppercase">
                                ECDM - ESTAÇÃO COMUNITÁRIA DE DADOS METEOROLÓGICOS (9 FONTES OFICIAIS)
                            </h2>
                            <p className="text-[10px] font-bold text-cyan-300">ABRANGÊNCIA MUNICIPAL E ESTADUAL • 92 MUNICÍPIOS DO RIO DE JANEIRO</p>
                            <p className="text-[9px] text-[#D4AF37]">Grupo a Chave da Esperança © GADE | GOES-19 DSAT + CEMADEN + INMET + INEA</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="relative border border-[#D4AF37] rounded-2xl overflow-hidden flex flex-col bg-[#08111e]">
                                <div className="absolute top-0 left-0 right-0 z-[1000] bg-black/95 text-[#D4AF37] p-2 text-[9px] font-extrabold text-center border-b border-[#D4AF37] leading-tight">
                                    🛰️ PORTAL 1 - MARIA CRISTINA / SEBINHO - MESQUITA<br/>ROTA LARANJA 9.2KM MENDANHA → SEBINHO
                                </div>
                                <div id="mapMaria" className="w-full h-[320px]"></div>
                                <div className="absolute bottom-10 left-2 z-[1000] bg-black/90 border border-[#00FF00] rounded p-1.5 text-[8px] leading-tight">
                                    <span className="text-[#00FF00]">●</span> GOES-19 AO VIVO<br/>Maria Cristina / Sebinho<br/>Zoom 17<br/><span style={{color:'#FF8C00'}}>■ Rota Mendanha</span>
                                </div>
                                <div className="bg-[#08111e] border-t border-[#D4AF37] p-1.5 text-center">
                                    <span className="text-slate-400 text-[9px] tracking-[2.5px] font-light lowercase">ecdm • pwa oficial &nbsp; • &nbsp; 9 fontes</span>
                                </div>
                            </div>

                            <div className="relative border border-[#D4AF37] rounded-2xl overflow-hidden flex flex-col bg-[#08111e]">
                                <div className="absolute top-0 left-0 right-0 z-[1000] bg-black/95 text-[#D4AF37] p-2 text-[9px] font-extrabold text-center border-b border-[#D4AF37] leading-tight">
                                    🛰️ PORTAL 2 - PARQUE LIBERDADE / SÃO BENTO - CAXIAS<br/>ROTA AZUL 4.2KM TINGUÁ → SÃO BENTO
                                </div>
                                <div id="mapBento" className="w-full h-[320px]"></div>
                                <div className="absolute bottom-10 left-2 z-[1000] bg-black/90 border border-[#00FF00] rounded p-1.5 text-[8px] leading-tight">
                                    <span className="text-[#00FF00]">●</span> GOES-19 AO VIVO<br/>São Bento / Liberdade<br/>Zoom 17<br/><span style={{color:'#1E90FF'}}>■ Rota Tinguá</span>
                                </div>
                                <div className="bg-[#08111e] border-t border-[#D4AF37] p-1.5 text-center">
                                    <span className="text-slate-400 text-[9px] tracking-[2.5px] font-light lowercase">ecdm • pwa oficial &nbsp; • &nbsp; 9 fontes</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ESTRUTURA PRINCIPAL DA ESTAÇÃO DE SOBREVIVÊNCIA
        function EstacaoSobrevivenciaModule() {
            const [telemetria, setTelemetria] = useState({ temp: 24.5, humidity: 60, wind: 12, rain: 0 });
            const [status, setStatus] = useState({ nivel: "OPERACIONAL", cor: "#10B981", msg: "ECDM OPERACIONAL - 9 FONTES OFICIAIS ATIVAS" });
            const [parecerIA, setParecerIA] = useState("SARAH AI NEXUS (Analista Sênior) - Monitorando as 9 fontes oficiais de dados públicos...");
            const [falando, setFalando] = useState(false);
            const [ultimaSync, setUltimaSync] = useState(new Date().toLocaleTimeString('pt-BR'));
            const [modoReal, setModoReal] = useState(true);

            const falar = useCallback((texto) => {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(texto);
                u.lang = 'pt-BR'; u.rate = 1.0; u.pitch = 1.05;
                u.onstart = () => setFalando(true);
                u.onend = () => setFalando(false);
                window.speechSynthesis.speak(u);
            }, []);

            const avaliar = useCallback((t, h, v, chuva) => {
                if (t >= 40 || chuva > 20 || v > 60) {
                    setStatus({ nivel: "CRÍTICO", cor: "#EF4444", msg: `ECDM ALERTA CRÍTICO (9 Fontes): Temp ${t.toFixed(1)}°C | Vento ${v.toFixed(0)}km/h | Chuva ${chuva}mm` });
                } else if (t >= 35 || h < 35) {
                    setStatus({ nivel: "ATENÇÃO", cor: "#F59E0B", msg: `ECDM ATENÇÃO: Condições adversas - Temp ${t.toFixed(1)}°C` });
                } else {
                    setStatus({ nivel: "OPERACIONAL", cor: "#10B981", msg: "ECDM OPERACIONAL - 9 FONTES PÚBLICAS SINCRONIZADAS" });
                }
            }, []);

            const analisarComSarah = useCallback(async (t, h, v, chuva) => {
                try {
                    setParecerIA("🛰️ SARAH (Analista Sênior) cruzando dados de INMET, CEMADEN, CPTEC e Alerta Rio...");
                    const prompt = `Você é SARAH, Analista Sênior da Estação Comunitária de Dados Meteorológicos (ECDM). Dados unificados das 9 fontes: ${t}°C, ${h}% umidade, ${v}km/h vento, ${chuva}mm chuva. Explique o quadro meteorológico atual de forma técnica e clara para a população dos 92 municípios do RJ em 2 frases.`;
                    const r = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ model: "openai/gpt-oss-120b", messages: [{ role: "system", content: "Você é SARAH, Analista Sênior da ECDM, especialista em meteorologia e desastres." }, { role: "user", content: prompt }], temperature: 0.3, max_tokens: 200 })
                    });
                    if (!r.ok) throw new Error("Erro API Worker");
                    const d = await r.json();
                    let texto = d?.choices?.[0]?.message?.content?.replace(/[#*]/g,'').trim() || `ECDM: ${t.toFixed(1)} graus monitorados via 9 fontes oficiais.`;
                    setParecerIA(texto);
                    falar(texto);
                    setUltimaSync(new Date().toLocaleTimeString('pt-BR'));
                } catch (e) {
                    const fb = `ECDM operando com 9 fontes públicas sob supervisão da Analista Sarah. Temperatura ${t.toFixed(1)} graus, umidade ${h} por cento. Todos unidos, todos protegidos.`;
                    setParecerIA(fb); falar(fb);
                }
            }, [falar]);

            useEffect(() => {
                if (!modoReal) return;
                const buscar = async () => {
                    try {
                        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=-22.7831&longitude=-43.4294&current=temperature_2m,relative_humidity_2m,wind_speed_10m,precipitation&timezone=America/Sao_Paulo`);
                        const j = await res.json();
                        if (j?.current) {
                            const t = { temp: j.current.temperature_2m, humidity: j.current.relative_humidity_2m, wind: j.current.wind_speed_10m, rain: j.current.precipitation || 0 };
                            setTelemetria(t); avaliar(t.temp, t.humidity, t.wind, t.rain); analisarComSarah(t.temp, t.humidity, t.wind, t.rain);
                        }
                    } catch {}
                };
                buscar(); const id = setInterval(buscar, 300000); return () => clearInterval(id);
            }, [modoReal, avaliar, analisarComSarah]);

            return (
                <div className="max-w-4xl mx-auto space-y-3 font-mono p-2">
                    <div className="rounded-[16px] border border-cyan-400/40 bg-[#081425] p-3 relative overflow-hidden">
                        <div className="absolute inset-0 bg-gradient-to-r from-cyan-500/10 via-transparent to-emerald-500/10"></div>
                        <div className="relative flex justify-between items-center">
                            <div className="flex items-center gap-2.5">
                                <div className={`w-8 h-8 rounded-lg flex items-center justify-center border ${falando ? 'bg-emerald-500 border-emerald-300 animate-pulse' : 'bg-cyan-500/20 border-cyan-400'}`}>🛰️</div>
                                <div>
                                    <h1 className="text-[10px] md:text-[11px] font-black text-cyan-200 tracking-widest">ESTAÇÃO COMUNITÁRIA DE DADOS METEOROLÓGICOS (ECDM)</h1>
                                    <p className="text-[8px] text-slate-400 tracking-widest">Analista Sarah • 9 Fontes • {ultimaSync} • {falando ? '🔊 FALANDO' : 'AO VIVO'}</p>
                                </div>
                            </div>
                            <button onClick={() => setModoReal(!modoReal)} className={`px-2.5 py-1 rounded-full text-[8px] font-bold border ${modoReal ? 'bg-emerald-500/20 border-emerald-400 text-emerald-300' : 'bg-slate-700 border-slate-500 text-slate-300'}`}>{modoReal ? '🛰️ ATIVO' : 'PAUSADO'}</button>
                        </div>
                    </div>

                    <div className="w-full rounded-[14px] p-3 text-white text-center font-black text-[10px] tracking-widest border border-white/20 shadow-[0_0_20px_rgba(0,0,0,0.5)] transition-all duration-500" style={{ backgroundColor: status.cor }}>{falando ? '🔊 ' : ''}{status.msg}</div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-2.5">
                        {[{l:'TEMPERATURA', v:`${telemetria.temp.toFixed(1)}°C`, c:'cyan'}, {l:'UMIDADE', v:`${telemetria.humidity.toFixed(0)}%`, c:'emerald'}, {l:'VENTO', v:`${telemetria.wind.toFixed(0)} km/h`, c:'amber'}, {l:'PRECIPITAÇÃO', v:`${telemetria.rain} mm`, c:'blue'}].map((k,i)=>(
                            <div key={i} className="bg-[#0f2242]/80 border border-white/10 rounded-xl p-3 backdrop-blur" key={i}>
                                <p className="text-[7px] text-slate-400 tracking-widest">{k.l}</p>
                                <p className="text-[18px] font-black text-white mt-0.5">{k.v}</p>
                                <div className="mt-1.5 h-[2px] w-full bg-white/10 rounded-full overflow-hidden"><div className="h-full bg-cyan-400 w-[75%] animate-pulse"></div></div>
                            </div>
                        ))}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-5 gap-3">
                        <div className="md:col-span-3 bg-[#0a1933] border border-cyan-400/30 rounded-[18px] p-3.5 space-y-2.5">
                            <div className="flex items-center justify-between">
                                <h3 className="text-[10px] font-black text-cyan-300 tracking-widest flex items-center gap-1.5">{falando ? '🎙️ SARAH (ANALISTA) FALANDO' : '🤖 SARAH AI NEXUS (ANALISTA SÊNIOR)'}</h3>
                                <span className="text-[7px] px-2 py-0.5 rounded-full bg-cyan-500/20 border border-cyan-400/30 text-cyan-300">Autônoma</span>
                            </div>
                            <div className="flex items-start gap-2.5 bg-black/20 rounded-xl p-2.5 border border-white/5">
                                <div className="w-10 h-10 rounded-xl overflow-hidden shrink-0 border border-cyan-400/40">
                                    <img src={SARAH_CUSTOM_AVATAR_URL} alt="SARAH AI" className="w-full h-full object-cover" />
                                </div>
                                <p className="text-[12px] text-slate-100 leading-relaxed flex-1">{parecerIA}</p>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => falar(parecerIA)} className="flex-1 py-2 rounded-xl bg-cyan-500/20 border border-cyan-400/50 text-cyan-200 text-[9px] font-bold hover:bg-cyan-500/35 transition cursor-pointer">🔊 OUVIR SARAH</button>
                                <button onClick={() => analisarComSarah(telemetria.temp, telemetria.humidity, telemetria.wind, telemetria.rain)} className="flex-1 py-2 rounded-xl bg-emerald-500/20 border border-emerald-400/50 text-emerald-200 text-[9px] font-bold hover:bg-emerald-500/35 transition cursor-pointer">🔄 REVALORIZAR</button>
                            </div>
                        </div>

                        <div className="md:col-span-2 bg-[#1a102a]/80 border border-fuchsia-400/30 rounded-[18px] p-3.5 space-y-2.5">
                            <h3 className="text-[9px] font-black text-fuchsia-300 tracking-widest">📡 FONTES INTEGRADAS</h3>
                            <div className="space-y-1.5 text-[8px] text-slate-300">
                                <div className="flex justify-between bg-white/5 p-1.5 rounded"><span>INMET &amp; CEMADEN</span><span className="text-emerald-400 font-bold">ONLINE</span></div>
                                <div className="flex justify-between bg-white/5 p-1.5 rounded"><span>CPTEC &amp; GOES-19</span><span className="text-emerald-400 font-bold">ONLINE</span></div>
                                <div className="flex justify-between bg-white/5 p-1.5 rounded"><span>INEA &amp; Alerta Rio</span><span className="text-emerald-400 font-bold">ONLINE</span></div>
                                <div className="flex justify-between bg-white/5 p-1.5 rounded"><span>MonitorAr &amp; El Niño</span><span className="text-emerald-400 font-bold">ONLINE</span></div>
                            </div>
                        </div>
                    </div>

                    <PortaisSatelite24HModule />
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<EstacaoSobrevivenciaModule />);
    </script>
</body>
</html>
