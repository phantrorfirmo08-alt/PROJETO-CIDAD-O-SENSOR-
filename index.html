<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarah - Assistente Técnico de Defesa Civil (Sebinho)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .hidden {
            display: none !important;
        }
        input, button, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #2e2e2e;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background: #007acc;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
        button:hover {
            background: #005999;
        }
        #chatLogs {
            height: 300px;
            overflow-y: auto;
            background: #121212;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            border: 1px solid #333;
        }
        .log-entry {
            margin-bottom: 10px;
        }
        .avatar-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        #avatarMouth {
            width: 40px;
            height: 10px;
            background: #ff5555;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 0.2s;
            margin-top: 5px;
        }
        .avatar-face {
            width: 60px;
            height: 60px;
            background: #444;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sarah - Defesa Civil Comunitária (Sebinho)</h2>
        
        <div id="apiSection">
            <label for="apiKeyInput">Chave de API do Gemini:</label>
            <input type="password" id="apiKeyInput" placeholder="Cole sua chave aqui...">
            <button onclick="saveApiKey()">Salvar Chave</button>
        </div>

        <div class="avatar-container">
            <div class="avatar-face">
                <div id="avatarMouth"></div>
            </div>
        </div>

        <div id="chatLogs"></div>

        <input type="text" id="userInput" placeholder="Digite sua mensagem para a Sarah..." onkeydown="if(event.key==='Enter') sendMessage();">
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
                document.getElementById('apiSection').classList.add('hidden');
            }
        };

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                document.getElementById('apiSection').classList.add('hidden');
                alert('Chave salva com sucesso!');
            } else {
                alert('Insira uma chave válida.');
            }
        }

        function addLog(sender, text) {
            const logs = document.getElementById('chatLogs');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<strong>${sender}:</strong> ${text.replace(/\n/g, '<br>')}`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const q = input.value.trim();
            if (!q) return;

            const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                alert('Por favor, insira e salve sua chave de API do Gemini.');
                document.getElementById('apiSection').classList.remove('hidden');
                return;
            }

            addLog('Eu', q);
            input.value = '';
            
            document.getElementById('avatarMouth').style.opacity = '1';

            try {
                const systemPrompt = `Você é a Sarah, assistente técnica de Defesa Civil Comunitária da Comunidade Sebinho, focada no trecho crítico compreendido na Rua Amazonas (leito do rio), passando pela ponte de entrada e a confluência do Rio Dona Eugênia com o Rio Sarapuí, estendendo-se até a linha férrea. Responda de forma objetiva, técnica e preventiva: ${q}`;

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: systemPrompt }] }] })
                });
                
                const data = await res.json();
                document.getElementById('avatarMouth').style.opacity = '0';

                if (data.error) {
                    throw new Error(data.error.message || 'Erro na API');
                }

                let ans = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Sem resposta retornada.";
                addLog('Sarah', ans);
            } catch (e) {
                document.getElementById('avatarMouth').style.opacity = '0';
                addLog('Sistema', `Erro na IA: ${e.message}`);
            }
        }
    </script>
</body>
</html>
